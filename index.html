<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Show – VIP Invitation</title>
<meta name="description" content="Create your personalised Road Show VIP invitation as a PDF.">
<meta property="og:title" content="Road Show – VIP Invitation">
<meta property="og:description" content="Create your personalised invitation and download it as a PDF.">
<meta property="og:image" content="https://orwaaah.github.io/invitation-/assets/invite-both.jpg">
<meta property="og:type" content="website">
<style>
  @font-face { font-family: "Source Serif 4"; font-weight: 700; font-display: swap;
    src: url(assets/source-serif-4-latin-700-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Source Serif 4"; font-weight: 700; font-display: swap;
    src: url(assets/source-serif-4-latin-ext-700-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; font-display: swap;
    src: url(assets/source-serif-4-latin-400-italic.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; font-display: swap;
    src: url(assets/source-serif-4-latin-ext-400-italic.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: "Noto Naskh Arabic"; font-weight: 400; font-display: swap;
    src: url(assets/noto-naskh-arabic-arabic-400-normal.woff2) format("woff2");
    unicode-range: U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC; }
  @font-face { font-family: "Noto Naskh Arabic"; font-weight: 700; font-display: swap;
    src: url(assets/noto-naskh-arabic-arabic-700-normal.woff2) format("woff2");
    unicode-range: U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC; }

  :root {
    --bg: #020a1c;
    --panel: #0a1730;
    --line: #1f3358;
    --text: #eaf2ff;
    --muted: #8fa6c8;
    --accent: #4fb6ff;
    --accent-ink: #001226;
    --error: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 80% at 80% 0%, #0b2d5c 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 980px; margin: 0 auto; padding: 28px 16px 48px;
    display: grid; gap: 28px; grid-template-columns: 1fr;
  }
  @media (min-width: 820px) {
    .wrap { grid-template-columns: 380px 1fr; align-items: start; padding-top: 48px; }
    .preview { position: sticky; top: 24px; }
    .preview canvas { width: auto; max-width: 100%; max-height: calc(100vh - 90px); }
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .2px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .field { margin-bottom: 18px; }
  .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  .lbl .opt { color: var(--muted); font-weight: 400; }
  .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .day { position: relative; }
  .day input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .day span {
    display: block; height: 100%; text-align: center; padding: 10px 4px; border-radius: 10px;
    border: 1px solid var(--line); background: #050f22; font-weight: 600; font-size: 14px; line-height: 1.3;
  }
  .day small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .day input:checked + span { border-color: var(--accent); background: rgba(79,182,255,.14); box-shadow: inset 0 0 0 1px var(--accent); }
  .day input:focus-visible + span { box-shadow: 0 0 0 3px rgba(79,182,255,.35); }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #050f22; color: var(--text); font-size: 16px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,182,255,.18); }
  .photo-pick {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px;
    border: 1px dashed var(--line); background: #050f22; cursor: pointer;
  }
  .photo-pick:hover, .photo-pick:focus-within { border-color: var(--accent); }
  .thumb {
    width: 52px; height: 52px; border-radius: 50%; flex: none; background: #13284a center/cover no-repeat;
    border: 2px solid #2a4572; display: grid; place-items: center; color: var(--muted);
  }
  .thumb svg { width: 22px; height: 22px; }
  .photo-pick .hint { color: var(--muted); font-size: 14px; }
  .photo-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .err { color: var(--error); font-size: 13px; margin-top: 6px; min-height: 0; }
  .err:empty { display: none; }
  .btn {
    width: 100%; padding: 14px 16px; border: 0; border-radius: 12px; cursor: pointer;
    font-size: 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink);
    display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); margin-top: 10px; }
  .ready { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  [hidden] { display: none !important; }
  .ready .btn.ghost { margin-top: 0; }
  .done { color: #9fe3b5; font-size: 14px; text-align: center; }
  .btn.secondary { background: #13284a; color: var(--text); }
  .hint-ios { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  .hint-ios svg { width: 15px; height: 15px; vertical-align: -2px; color: var(--text); }
  .hint-ios b { color: var(--text); }
  .preview canvas {
    width: 100%; height: auto; display: block; border-radius: 12px; margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.55); background: #000;
  }
  .preview p { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0 0; }
</style>
</head>
<body>
<main class="wrap">
  <section>
    <h1>Road Show · VIP Invitation</h1>
    <p class="sub">Fill in the details and download your invitation as a PDF.</p>

    <form id="form" novalidate>
      <div class="field">
        <label class="lbl" for="greeting">Greeting <span class="opt">(optional)</span></label>
        <input id="greeting" type="text" autocomplete="off" maxlength="24" placeholder="Dear">
      </div>

      <div class="field">
        <label class="lbl" for="guest">Guest name</label>
        <input id="guest" type="text" autocomplete="off" maxlength="40" placeholder="Name">
        <div class="err" id="guest-err"></div>
      </div>

      <div class="field">
        <span class="lbl" id="day-lbl">Day of visit</span>
        <div class="days" role="radiogroup" aria-labelledby="day-lbl">
          <label class="day"><input type="radio" name="day" value="sat"><span>Saturday<small>21 Nov</small></span></label>
          <label class="day"><input type="radio" name="day" value="sun"><span>Sunday<small>22 Nov</small></span></label>
          <label class="day"><input type="radio" name="day" value="both"><span>Not sure yet<small>21–22 Nov</small></span></label>
        </div>
        <div class="err" id="day-err"></div>
      </div>

      <div class="field">
        <label class="lbl" for="host">Your name</label>
        <input id="host" type="text" autocomplete="name" maxlength="40" placeholder="Name">
        <div class="err" id="host-err"></div>
      </div>

      <div class="field">
        <label class="lbl" for="photo">Your photo</label>
        <label class="photo-pick">
          <span class="thumb" id="thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
          </span>
          <span class="hint" id="photo-hint">Tap to choose a photo</span>
          <input id="photo" type="file" accept="image/*">
        </label>
        <div class="err" id="photo-err"></div>
      </div>

      <button class="btn" id="make" type="submit">Create invitation</button>

      <div class="ready" id="ready" hidden>
        <div class="done">Your invitation is ready ✓</div>
        <button class="btn" id="share" type="button" hidden>Share / Save PDF</button>
        <button class="btn" id="download" type="button">Download PDF</button>
        <p class="hint-ios" id="ios-hint" hidden>If the invitation opens on screen, tap the Share icon
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          and choose <b>Save to Files</b>.</p>
        <button class="btn ghost" id="another" type="button">Create another invitation</button>
      </div>
    </form>
  </section>

  <section class="preview" aria-label="Invitation preview">
    <canvas id="preview" width="1493" height="2000"></canvas>
    <p>Live preview</p>
  </section>
</main>

<script src="assets/jspdf.umd.min.js"></script>
<script>
(() => {
  // One design per day choice. Positions are in each design's own pixel space.
  // A higher-resolution export of a design with the same proportions can replace its file as-is.
  const DESIGNS = {
    sat: {  // blue, "Saturday 21"
      src: 'assets/invite-sat.jpg', w: 1493, h: 2000,
      dear:   { box: [659, 1164, 833, 1230], cx: 746, baseline: 1219, cap: 46, maxW: 210 },  // the word "Dear"
      guest:  { cx: 747, baseline: 1301, cap: 56, maxW: 900 },     // centred on the line under "Dear"
      host:   { x: 652, baseline: 1828, cap: 51, maxW: 650 },      // between the two short lines
      photo:  { cx: 472, cy: 1806.5, r: 143 },                     // 1.5x the white circle, still covers it
      number: { x: 1438, baseline: 1950, size: 30 },               // bottom right
    },
    sun: {  // red, "Sunday 22"
      src: 'assets/invite-sun.jpg', w: 1493, h: 2000,
      dear:   { box: [697, 1155, 873, 1221], cx: 785, baseline: 1210, cap: 46, maxW: 214 },
      guest:  { cx: 785, baseline: 1294.5, cap: 56, maxW: 930 },
      host:   { x: 661, baseline: 1820, cap: 51, maxW: 650 },
      photo:  { cx: 481, cy: 1798.5, r: 141.75 },
      number: { x: 1438, baseline: 1950, size: 30 },
    },
    both: {  // blue, "21–22" for guests who haven't picked a day
      src: 'assets/invite-both.jpg', w: 1621, h: 2000,
      dear:   { box: [719, 1157, 900, 1225], cx: 809.5, baseline: 1214, cap: 46, maxW: 220 },
      guest:  { cx: 809.5, baseline: 1297.5, cap: 56, maxW: 950 },
      host:   { x: 683, baseline: 1829, cap: 51, maxW: 650 },
      photo:  { cx: 501, cy: 1807.5, r: 140.25 },
      number: { x: 1566, baseline: 1950, size: 30 },
    },
  };
  const FONT = '"Source Serif 4", "Noto Naskh Arabic", serif';
  const EXPORT_SCALE = 1.3;   // about 2000 × 2600 px: sharper than the designs, still light on phones
  const PHOTO_PX = 400;       // the uploaded photo is cropped and shrunk once to this square
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const $ = (id) => document.getElementById(id);
  const greetIn = $('greeting');
  const guestIn = $('guest'), hostIn = $('host'), photoIn = $('photo');
  const preview = $('preview'), makeBtn = $('make');
  const readyEl = $('ready'), shareBtn = $('share'), downloadBtn = $('download'), anotherBtn = $('another');
  const iosHint = $('ios-hint');
  const dayInputs = [...document.querySelectorAll('input[name="day"]')];

  const templates = {};          // design key -> loaded image
  const erased = {};             // design key -> same design with the word "Dear" painted out
  let photo = null, ready = null, busy = false, shownNumber = '';

  const chosenDay = () => (dayInputs.find((i) => i.checked) || {}).value || '';
  const design = () => DESIGNS[chosenDay() || 'both'];   // no choice yet: preview the two-day design
  const exportCanvas = document.createElement('canvas');

  const loadImage = (src) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });

  const isRTL = (s) => /[֐-ࣿיִ-﷿ﹰ-﻿]/.test(s);

  // Font size whose capital-letter height matches the design, shrunk to fit maxW.
  function fitFont(ctx, text, cap, maxW) {
    ctx.font = `700 100px ${FONT}`;
    const capH = ctx.measureText('H').actualBoundingBoxAscent || 72;
    let size = cap * 100 / capH;
    ctx.font = `700 ${size}px ${FONT}`;
    const w = ctx.measureText(text).width;
    if (w > maxW) size *= maxW / w;
    return size;
  }

  function drawText(ctx, text, spec, align) {
    if (!text) return;
    ctx.save();
    ctx.direction = isRTL(text) ? 'rtl' : 'ltr';
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#ffffff';
    const size = fitFont(ctx, text, spec.cap, spec.maxW);
    ctx.font = `700 ${size}px ${FONT}`;
    ctx.fillText(text, align === 'center' ? spec.cx : spec.x, spec.baseline);
    ctx.restore();
  }

  // Custom greeting ("Mr.", "Mrs.", "السيد"...) in place of "Dear"; empty or "Dear" keeps the design as is.
  const greeting = () => {
    const g = greetIn.value.trim();
    return /^dear$/i.test(g) ? '' : g;
  };

  // Paint "Dear" out of a design by filling its box from the surrounding background (a Coons patch:
  // blends the four edges, so the fill meets the gradient around it without a visible seam).
  function eraseDear(key) {
    if (erased[key]) return erased[key];
    const img = templates[key], D = DESIGNS[key];
    if (!img) return null;
    const c = document.createElement('canvas');
    c.width = D.w; c.height = D.h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, D.w, D.h);
    const [x0, y0, x1, y1] = D.dear.box, B = 3;                 // B: border band averaged against JPEG noise
    const X = x0 - B, Y = y0 - B, w = x1 - x0 + 1 + 2 * B, h = y1 - y0 + 1 + 2 * B;
    const im = ctx.getImageData(X, Y, w, h), d = im.data;
    const at = (x, y, k) => d[(y * w + x) * 4 + k];
    const band = (fx, fy, n, k) => { let t = 0; for (let i = 0; i < n; i++) t += at(fx(i), fy(i), k); return t / n; };
    const top = [], bot = [], left = [], right = [];
    for (let x = 0; x < w; x++) for (let k = 0; k < 3; k++) {
      (top[x] = top[x] || [])[k] = band(() => x, (i) => i, B, k);
      (bot[x] = bot[x] || [])[k] = band(() => x, (i) => h - 1 - i, B, k);
    }
    for (let y = 0; y < h; y++) for (let k = 0; k < 3; k++) {
      (left[y] = left[y] || [])[k] = band((i) => i, () => y, B, k);
      (right[y] = right[y] || [])[k] = band((i) => w - 1 - i, () => y, B, k);
    }
    const ty = (B - 1) / 2, by = h - 1 - ty, lx = ty, rx = w - 1 - ty;
    for (let y = B; y < h - B; y++) {
      const v = (y - ty) / (by - ty);
      for (let x = B; x < w - B; x++) {
        const u = (x - lx) / (rx - lx);
        for (let k = 0; k < 3; k++) {
          const vert = top[x][k] * (1 - v) + bot[x][k] * v;
          const horiz = left[y][k] * (1 - u) + right[y][k] * u;
          const corners = (1 - u) * (1 - v) * top[0][k] + u * (1 - v) * top[w - 1][k]
                        + (1 - u) * v * bot[0][k] + u * v * bot[w - 1][k];
          d[(y * w + x) * 4 + k] = vert + horiz - corners + (Math.random() - 0.5) * 1.5;  // light dither, no banding
        }
      }
    }
    ctx.putImageData(im, X, Y);
    return (erased[key] = c);
  }

  function drawGreeting(ctx, text, spec) {
    if (!text) return;
    const style = isRTL(text) ? '400' : 'italic 400';    // Arabic has no italic; keep it upright
    ctx.save();
    ctx.direction = isRTL(text) ? 'rtl' : 'ltr';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f4f7fb';
    ctx.font = `italic 400 100px ${FONT}`;
    const capH = ctx.measureText('H').actualBoundingBoxAscent || 66;
    let size = spec.cap * 100 / capH;
    ctx.font = `${style} ${size}px ${FONT}`;
    const w = ctx.measureText(text).width;
    if (w > spec.maxW) size *= spec.maxW / w;
    ctx.font = `${style} ${size}px ${FONT}`;
    ctx.fillText(text, spec.cx, spec.baseline);
    ctx.restore();
  }

  function drawPhoto(ctx, spec) {
    if (!photo) return;
    const { cx, cy, r } = spec;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(photo, cx - r, cy - r, r * 2, r * 2);
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.stroke();
  }

  function drawNumber(ctx, number, spec) {
    if (!number) return;
    ctx.save();
    ctx.font = `700 ${spec.size}px ${FONT}`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(`No. ${number}`, spec.x, spec.baseline);
    ctx.restore();
  }

  function render(canvas, scale, number) {
    const D = design();
    canvas.width = Math.round(D.w * scale);
    canvas.height = Math.round(D.h * scale);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const key = chosenDay() || 'both', greet = greeting();
    const tpl = greet ? eraseDear(key) : templates[key];
    if (tpl) ctx.drawImage(tpl, 0, 0, D.w, D.h);
    else { ctx.fillStyle = '#0a1d3f'; ctx.fillRect(0, 0, D.w, D.h); }
    if (greet) drawGreeting(ctx, greet, D.dear);
    drawText(ctx, guestIn.value.trim(), D.guest, 'center');
    drawText(ctx, hostIn.value.trim(), D.host, 'left');
    drawPhoto(ctx, D.photo);
    drawNumber(ctx, number, D.number);
    return canvas;
  }

  // Preview only needs to be as sharp as the screen shows it; keeps phone memory low.
  function previewScale() {
    const px = (preview.clientWidth || 450) * (window.devicePixelRatio || 1);
    return Math.max(0.5, Math.min(1.5, px / design().w));
  }

  async function ensureFonts() {
    const sample = 'H No. 0123456789 ' + guestIn.value + ' ' + hostIn.value;
    try {
      await Promise.all([
        document.fonts.load(`700 40px ${FONT}`, sample),
        document.fonts.load(`italic 400 40px ${FONT}`, 'H ' + greetIn.value),
        document.fonts.load(`400 40px ${FONT}`, greetIn.value || 'H'),
      ]);
    } catch (e) {}
  }

  let pending = 0;
  async function refresh() {
    const ticket = ++pending;
    await ensureFonts();
    if (ticket === pending) render(preview, previewScale(), shownNumber);
  }

  function setErr(id, msg) { $(id).textContent = msg || ''; }

  function validate() {
    let ok = true;
    if (!guestIn.value.trim()) { setErr('guest-err', 'Please enter the guest name'); ok = false; } else setErr('guest-err');
    if (!chosenDay())          { setErr('day-err', 'Please choose the day'); ok = false; } else setErr('day-err');
    if (!hostIn.value.trim())  { setErr('host-err', 'Please enter your name'); ok = false; } else setErr('host-err');
    if (!photo)                { setErr('photo-err', 'Please choose your photo'); ok = false; } else setErr('photo-err');
    return ok;
  }

  // Invitation number: 2 letters + 5 digits, random, e.g. KT48219 (about 57 million combinations,
  // so repeats are very rare). Letters I and O are left out so they can't be misread as 1 and 0.
  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  function newNumber() {
    const r = new Uint32Array(7);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(r);
    else for (let i = 0; i < 7; i++) r[i] = Math.floor(Math.random() * 2 ** 32);
    let n = LETTERS[r[0] % LETTERS.length] + LETTERS[r[1] % LETTERS.length];
    for (let i = 2; i < 7; i++) n += r[i] % 10;
    return n;
  }

  // Each invitation has its own number, so its file name never replaces an earlier invitation.
  function fileName(number) {
    const g = guestIn.value.trim().replace(/[^A-Za-z0-9 ._-]+/g, '').trim().replace(/\s+/g, '-');
    return `RoadShow-Invitation-${g ? g + '-' : ''}${number}.pdf`;
  }

  async function buildPdf(number) {
    await ensureFonts();
    const D = design();
    render(exportCanvas, EXPORT_SCALE, number);
    const jpeg = exportCanvas.toDataURL('image/jpeg', 0.92);
    exportCanvas.width = exportCanvas.height = 0;            // free the memory straight away (iOS)
    const { jsPDF } = window.jspdf;
    const W = 595.28, H = W * D.h / D.w;                      // A4 width, design proportions
    const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: [W, H], compress: true });
    doc.addImage(jpeg, 'JPEG', 0, 0, W, H, undefined, 'FAST');
    doc.setProperties({ title: 'Road Show – VIP Invitation' });
    const name = fileName(number);
    const blob = doc.output('blob');
    return { number, name, blob, url: URL.createObjectURL(blob), file: new File([blob], name, { type: 'application/pdf' }) };
  }

  // Must run inside the tap itself, so the browser treats it as the user's own download.
  function downloadReady() {
    if (!ready) return;
    const a = document.createElement('a');
    a.href = ready.url;
    a.download = ready.name;
    a.rel = 'noopener';
    if (IS_IOS) a.target = '_blank';   // if a browser ignores "download", open a new tab instead of replacing this page
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  const canShareFile = (f) => {
    try { return !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { return false; }
  };

  // Any change means the prepared PDF no longer matches the form.
  function clearReady() {
    if (ready) URL.revokeObjectURL(ready.url);
    ready = null;
    shownNumber = '';
    readyEl.hidden = true;
    makeBtn.hidden = false;
  }

  function onEdit(errId) {
    setErr(errId);
    clearReady();
    refresh();
  }

  guestIn.addEventListener('input', () => onEdit('guest-err'));
  greetIn.addEventListener('input', () => onEdit('guest-err'));
  dayInputs.forEach((i) => i.addEventListener('change', () => onEdit('day-err')));
  // The host's name and photo are remembered on this phone, so the next visit only needs the guest name.
  const SAVED = { name: 'roadshow.hostName', photo: 'roadshow.hostPhoto' };
  const saved = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage full or blocked: just don't remember */ } },
  };

  function showPhoto(img, dataUrl) {
    photo = img;
    $('thumb').style.backgroundImage = `url("${dataUrl}")`;
    $('thumb').innerHTML = '';
    $('photo-hint').textContent = 'Change photo';
  }

  hostIn.addEventListener('input', () => { saved.set(SAVED.name, hostIn.value); onEdit('host-err'); });

  photoIn.addEventListener('change', async () => {
    const f = photoIn.files && photoIn.files[0];
    photoIn.value = '';                // lets the same photo be picked again later
    if (!f) return;
    if (f.type && !f.type.startsWith('image/')) { setErr('photo-err', 'Please choose an image file'); return; }
    const url = URL.createObjectURL(f);
    try {
      const img = await loadImage(url);
      // Crop to a square once (portraits keep the face, which sits high) and drop the full-size original.
      const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.min(iw, ih);
      const sx = (iw - s) / 2, sy = ih > iw ? (ih - s) * 0.3 : (ih - s) / 2;
      const c = document.createElement('canvas');
      c.width = c.height = Math.min(PHOTO_PX, s);
      const cx = c.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, sx, sy, s, s, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.85);
      showPhoto(c, dataUrl);
      saved.set(SAVED.photo, dataUrl);
      onEdit('photo-err');
    } catch (e) {
      setErr('photo-err', "This photo couldn't be opened, please try another one");
    } finally {
      URL.revokeObjectURL(url);
    }
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy || !validate()) return;
    busy = true;
    makeBtn.disabled = true;
    makeBtn.textContent = 'Creating…';
    try {
      clearReady();
      ready = await buildPdf(newNumber());
      shownNumber = ready.number;        // the preview shows the number that is on the PDF
      refresh();
      const canShare = canShareFile(ready.file);
      shareBtn.hidden = !canShare;
      shareBtn.textContent = IS_IOS ? 'Save / Send PDF' : 'Share PDF';
      shareBtn.classList.toggle('secondary', !IS_IOS);
      // On iPhone "Download" only opens the PDF on screen; the share sheet is what saves it
      // (Save to Files) or sends it (WhatsApp), so it is the only button there.
      downloadBtn.hidden = IS_IOS && canShare;
      iosHint.hidden = !(IS_IOS && !canShare);
      readyEl.hidden = false;
      makeBtn.hidden = true;
      if (!IS_IOS) downloadReady();      // one tap on Android and desktop
      readyEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } catch (err) {
      setErr('photo-err', 'Something went wrong, please try again');
    } finally {
      busy = false;
      makeBtn.disabled = false;
      makeBtn.textContent = 'Create invitation';
    }
  });

  downloadBtn.addEventListener('click', downloadReady);

  shareBtn.addEventListener('click', async () => {
    if (!ready) return;
    try {
      await navigator.share({ files: [ready.file] });
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // closed the share sheet
      downloadReady();                            // sharing not allowed here: fall back to a download
      if (IS_IOS) iosHint.hidden = false;
    }
  });

  anotherBtn.addEventListener('click', () => {
    guestIn.value = '';
    greetIn.value = '';
    dayInputs.forEach((i) => { i.checked = false; });
    setErr('day-err');
    onEdit('guest-err');
    guestIn.scrollIntoView({ block: 'center', behavior: 'smooth' });
    guestIn.focus({ preventScroll: true });
  });

  // Coming back to the page (e.g. after viewing the PDF) must leave everything usable.
  window.addEventListener('pageshow', () => {
    busy = false;
    makeBtn.disabled = false;
    makeBtn.textContent = 'Create invitation';
    refresh();
  });

  // Bring back what this phone saved last time.
  const savedName = saved.get(SAVED.name);
  if (savedName) hostIn.value = savedName;
  const savedPhoto = saved.get(SAVED.photo);
  if (savedPhoto) loadImage(savedPhoto).then((img) => { showPhoto(img, savedPhoto); refresh(); }).catch(() => {});

  Object.entries(DESIGNS).forEach(([key, D]) => {
    loadImage(D.src).then((img) => { templates[key] = img; refresh(); }).catch(() => {});
  });
})();
</script>
</body>
</html>
